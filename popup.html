<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>划词翻译</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2329;
      --text-2: #646a73;
      --text-3: #8f959e;
      --border: #e5e8eb;
      --primary: #07c160;
      --primary-dark: #06ad56;
      --primary-weak: rgba(7, 193, 96, 0.1);
      --result-bg: #f7f8fa;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --card: #232529;
        --text: #e8eaed;
        --text-2: #a9afb8;
        --text-3: #7c828c;
        --border: #34383e;
        --primary-weak: rgba(7, 193, 96, 0.18);
        --result-bg: #1b1d20;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== 顶栏 ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(135deg, #07c160 0%, #05a050 100%);
      color: #fff;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.2);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700;
    }
    .header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
    .header p { font-size: 11px; opacity: 0.85; margin-top: 1px; }
    .icon-btn {
      width: 30px; height: 30px;
      border: none; border-radius: 8px;
      background: rgba(255,255,255,0.15);
      color: #fff; font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.3); }

    .content { padding: 12px; }

    /* ===== 语言栏 ===== */
    .lang-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .lang-bar select {
      flex: 1; min-width: 0;
      padding: 8px 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .lang-bar select:focus { border-color: var(--primary); }
    .swap-btn {
      flex: none;
      width: 30px; height: 30px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--card);
      color: var(--text-2);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .swap-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-weak);
      transform: rotate(180deg);
    }

    /* ===== 输入区 ===== */
    .input-wrap { position: relative; margin-bottom: 10px; }
    #inputText {
      width: 100%;
      padding: 10px 12px 22px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13.5px;
      font-family: inherit;
      line-height: 1.5;
      background: var(--card);
      color: var(--text);
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    #inputText:focus { border-color: var(--primary); }
    .clear-btn {
      position: absolute; top: 6px; right: 6px;
      width: 20px; height: 20px;
      border: none; border-radius: 50%;
      background: var(--border);
      color: var(--text-2);
      font-size: 13px; line-height: 1;
      cursor: pointer;
      display: none;
    }
    .clear-btn:hover { background: var(--text-3); color: #fff; }
    .char-count {
      position: absolute; bottom: 6px; right: 10px;
      font-size: 10.5px; color: var(--text-3);
      pointer-events: none;
    }

    /* ===== 引擎 + 翻译按钮 ===== */
    .action-row { display: flex; gap: 8px; margin-bottom: 10px; }
    #engineSelect {
      flex: 1; min-width: 0;
      padding: 8px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    #engineSelect:focus { border-color: var(--primary); }
    #translateBtn {
      flex: none;
      padding: 8px 22px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #translateBtn:hover { background: var(--primary-dark); }
    #translateBtn:active { transform: scale(0.97); }
    #translateBtn:disabled { background: var(--text-3); cursor: not-allowed; }

    /* ===== 结果区 ===== */
    .result-card {
      background: var(--result-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 74px;
    }
    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .lang-chip {
      font-size: 11px;
      color: var(--primary);
      background: var(--primary-weak);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .result-actions { display: flex; gap: 4px; }
    .result-actions button {
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .result-actions button:hover { background: var(--primary-weak); color: var(--primary); }
    .result-text {
      font-size: 13.5px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      color: var(--text);
    }
    .result-text:empty::before,
    .result-text.placeholder { content: ''; color: var(--text-3); }
    .result-text.placeholder { color: var(--text-3); }
    .result-text.error { color: #ff4d4f; font-size: 12.5px; }

    .loading-row { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 快捷提示 & 页脚 ===== */
    .tips {
      margin-top: 10px;
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.7;
      padding: 0 2px;
    }
    .tips kbd {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
      font-size: 10.5px;
      font-family: inherit;
    }
    .footer {
      padding: 10px 16px 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
    }
    .footer a { color: var(--primary); text-decoration: none; margin: 0 4px; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">译</div>
      <div>
        <h1>划词翻译</h1>
        <p>免费 · 多引擎 · 支持大模型</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="打开设置">⚙</button>
  </div>

  <div class="content">
    <div class="lang-bar">
      <select id="sourceLang" title="源语言"></select>
      <button id="swapBtn" class="swap-btn" title="交换语言">⇄</button>
      <select id="targetLang" title="目标语言"></select>
    </div>

    <div class="input-wrap">
      <textarea id="inputText" rows="3" placeholder="输入或粘贴要翻译的文本…" maxlength="5000"></textarea>
      <button id="clearBtn" class="clear-btn" title="清空">×</button>
      <div class="char-count" id="charCount"></div>
    </div>

    <div class="action-row">
      <select id="engineSelect" title="选择翻译引擎"></select>
      <button id="translateBtn">翻译</button>
    </div>

    <div class="result-card">
      <div class="result-meta" id="resultMeta" style="display:none">
        <span class="lang-chip" id="detectedChip"></span>
        <span class="result-actions">
          <button id="copyBtn" title="复制译文">📋 复制</button>
          <button id="speakBtn" title="朗读译文">🔊 朗读</button>
        </span>
      </div>
      <div class="result-text placeholder" id="resultBox">翻译结果将显示在这里</div>
    </div>

    <div class="tips">
      💡 在网页中<b>选中文字即可翻译</b>，或按 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd>
    </div>
  </div>

  <div class="footer">
    <a href="options.html" target="_blank">设置</a> ·
    <a href="https://github.com/GoJerry/simple-translation-plugins" target="_blank">GitHub</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
